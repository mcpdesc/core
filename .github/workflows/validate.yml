name: Validate

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

  validate:
    needs: validate-runtime
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require runtime matrix to pass
        env:
          VALIDATE_RUNTIME_RESULT: ${{ needs.validate-runtime.result }}
        run: test "$VALIDATE_RUNTIME_RESULT" = "success"

  validator-node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test --workspace @mcpdesc/validator
