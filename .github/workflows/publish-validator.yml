name: Publish validator

'on':
  push:
    tags:
      - 'validator-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release version
        run: |
          package_version=$(node --input-type=module --eval "import packageMetadata from './packages/validator/package.json' with { type: 'json' }; console.log(packageMetadata.version)")
          test "$GITHUB_REF_NAME" = "validator-v$package_version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: npm ci
      - run: npm test --workspace @mcpdesc/validator
      - name: Publish validator
        run: |
          version="${GITHUB_REF_NAME#validator-v}"
          if [[ "$version" == *-* ]]; then
            npm publish --workspace @mcpdesc/validator --access public --tag next --provenance
          else
            npm publish --workspace @mcpdesc/validator --access public --tag latest --provenance
          fi
